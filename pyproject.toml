[project]
name = "tft-pipeline"
version = "0.1.0"
description = "analysis of tft placements"
readme = "README.md"
authors = [
    { name = "Audrey Tsung", email = "audreytsung2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tft-pipeline = "tft_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
